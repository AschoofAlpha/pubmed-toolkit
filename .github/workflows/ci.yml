name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run tests
        # Every test is offline: canonical records are synthetic fixtures, so CI
        # never depends on CrossRef or NCBI being reachable.
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_identity_filter.py
          python tests/test_pdf_validation.py
          python tests/test_pubmed_parse.py
          python tests/test_search_query.py
          python tests/test_verify.py
          python tests/test_verify_regressions.py

      - name: CLI smoke test
        run: python -m pubmed_toolkit verify --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
